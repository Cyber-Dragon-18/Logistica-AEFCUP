<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Registo de Membro - AEFCUP</title>
    <link rel ="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/lib/LogoBranco.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Logística">
    <link rel="apple-touch-icon" href="/lib/LogoBranco.png">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: var(--bg);">
    <div class="card" style="width: 100%; max-width: 600px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="background-color: var(--primary); display: inline-flex; padding: 12px; border-radius: 12px; box-shadow: 0 4px 10px rgba(26, 115, 232, 0.2);">
                <img src="/lib/LogoBranco.png" alt="Logo AEFCUP" style="height: 40px; width: auto;">
            </div>
            <h2 style="margin-top: 15px;">Criar Conta de Membro</h2>
            <p style="color: #70757a; font-size: 14px;">Acesso ao Sistema de Logística e Turnos</p>
        </div>

        <div class="form-grid">
            <div>
                <label for="regName">Nome Completo</label>
                <input type="text" id="regName" placeholder="Ex: Rodrigo Coelho">
            </div>
            
            <div>
                <label for="regEmail">E-mail (Login)</label>
                <input type="email" id="regEmail" placeholder="exemplo@aefcup.pt">
            </div>

            <div>
                <label for="regDept">Departamento</label>
                <select id="regDept" required>
                    <option value="" disabled selected>Seleciona o teu departamento</option>
                    <option value="Apoio ao Estudante">Apoio ao Estudante</option>
                    <option value="Desportivo">Desportivo</option>
                    <option value="Emprego e Formação">Emprego e Formação</option>
                    <option value="Intervenção Social e Sustentabilidade">Intervenção Social e Sustentabilidade</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Recreativo e Cultural">Recreativo e Cultural</option>
                    <option value="Núcleo de Gestão">Núcleo de Gestão</option>
                    <option value="Logística">Logística</option>
                </select>
            </div>

            <div>
                <label for="regRole">Cargo na AE</label>
                <select id="regRole" required>
                    <option value="MEMBRO">Vogal</option>
                    <option value="COORDENADOR">Coordenador</option>
                </select>
            </div>

            <div style="grid-column: span 2;">
                <label for="regPass">Palavra-passe</label>
                <input type="password" id="regPass" placeholder="Escolha uma senha segura">
            </div>
        </div>

        <button onclick="doRegister()" style="width: 100%; margin-top: 20px; background: var(--primary); color: white; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;">Finalizar Registo</button>
        
        <p style="text-align: center; margin-top: 20px; font-size: 14px;">
            Já tem conta? <a href="/" style="color: var(--primary); text-decoration: none; font-weight: 600;">Entrar aqui</a>
        </p>
    </div>

    <script>
        async function doRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPass').value;
            const department = document.getElementById('regDept').value;
            const role = document.getElementById('regRole').value;

            if (!name || !email || !password || !department) {
                alert("Por favor, preencha todos os campos obrigatórios.");
                return;
            }

            const body = {
                name: name,
                email: email,
                password: password,
                department: department,
                role: role // Envia o cargo selecionado (MEMBRO ou COORDENADOR)
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    alert("Conta criada com sucesso! Agora pode fazer o login.");
                    window.location.href = "/";
                } else {
                    const errorText = await res.text();
                    alert("Erro ao criar conta: " + errorText);
                }
            } catch (err) {
                alert("Erro de ligação ao servidor.");
            }
        }
    </script>
</body>
</html>
