<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Logistica AEFCUP</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/lib/LogoBranco.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Logística">
    <link rel="apple-touch-icon" href="/lib/LogoBranco.png">
    <style>
        @media (max-width: 640px) {
            body { padding: 16px; align-items: flex-start; padding-top: 40px; }
            .card { padding: 24px 18px; }
            input { font-size: 16px; }
            button { padding: 14px; font-size: 16px; }
        }
    </style>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: var(--bg);">
    <div class="card" style="max-width: 400px; width: 90%; display: flex; flex-direction: column;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="background-color: var(--primary); 
                        display: inline-flex; 
                        padding: 16px; 
                        border-radius: 16px; 
                        box-shadow: 0 4px 12px rgba(26, 115, 232, 0.2);">
                <img src="/lib/LogoBranco.png" alt="Logo AEFCUP" style="height: 50px; width: auto;">
            </div>
        </div>

        <h2 style="text-align: center; margin-bottom: 8px;">Bem-Vindo</h2>
        <p style="text-align: center; color: #70757a; margin-bottom: 24px; font-size: 14px;">Requisições Logística AEFCUP</p>
        
        <form id="loginForm" class="form-group" style="display: flex; flex-direction: column;" onsubmit="event.preventDefault(); doLogin();">               
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="exemplo@aefcup.pt">
            
            <label for="password">Palavra-passe</label>
            <input type="password" id="password" placeholder="password">
            
            <button onclick="doLogin()" style="width: 100%; margin-top: 16px;">Entrar</button>
            
            <p id="errMsg" style="color: var(--danger); font-size: 14px; text-align: center; display: none; margin-top: 15px;">
                Login inválido. Tente novamente.
            </p>
        </form>

        <p style="text-align: center; margin-top: 24px; font-size: 14px;">
            Não tem conta? <a href="/register.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Registe-se aqui</a>
        </p>
    </div>

    <script>
        async function doLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errMsg = document.getElementById('errMsg');

            // Talk to your Go backend
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const user = await res.json();
                // Save user data (ID and Role) to the browser
                localStorage.setItem('user', JSON.stringify(user));
                // Move to the dashboard
                window.location.href = "/dashboard.html";
            } else {
                errMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
