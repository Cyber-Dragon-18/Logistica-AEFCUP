<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Utilizadores - Admin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="/lib/LogoBranco.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Logística">
    <link rel="apple-touch-icon" href="/lib/LogoBranco.png">

    <style>
        @media (max-width: 640px) {
            body { padding: 8px; }
            .card { padding: 14px; }

            /* Header */
            header { flex-wrap: wrap; gap: 10px; margin-bottom: 20px !important; }
            header h2 { font-size: 17px !important; }

            /* Hide table, show cards instead */
            .table-container table thead { display: none; }
            .table-container table, 
            .table-container tbody, 
            .table-container tr { display: block; width: 100%; }
            .table-container tr {
                margin-bottom: 14px;
                border: 1px solid #eee;
                border-radius: 12px;
                padding: 14px;
                background: white;
                box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            }
            .table-container td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 6px 0;
                border: none;
                font-size: 13px;
                gap: 8px;
            }
            .table-container td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #5f6368;
                font-size: 12px;
                flex-shrink: 0;
            }
            .table-container td button { font-size: 12px; padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2>Gestão de Utilizadores</h2>
            <button onclick="window.location.href='/dashboard.html'" style="background:#5f6368;">Voltar</button>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Departamento</th>
                        <th>Cargo Atual</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>

    <!-- SELF-DESTRUCT — apenas visível para o super-admin -->
    <div id="selfDestructZone" style="display:none; margin-top: 24px;">
        <div class="card" style="border: 1px solid rgba(217,48,37,0.25); background: rgba(217,48,37,0.03);">
            <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
                <div style="font-size:28px; line-height:1;">💣</div>
                <div>
                    <h3 style="margin:0; color:#d93025; font-size:16px;">Zona de Destruição</h3>
                    <p style="margin:4px 0 0; font-size:13px; color:#888;">Elimina todos os dados e desativa a aplicação permanentemente.</p>
                </div>
            </div>
            <button id="selfDestructBtn" onclick="triggerSelfDestruct()"
                style="background:#d93025; color:white; border:none; padding:12px 24px;
                       border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
                       display:flex; align-items:center; gap:8px; transition: all 0.2s;">
                💣 Destruir Aplicação
            </button>
        </div>
    </div>

    <script src="/notify.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || (user.role !== 'LOGISTICA' && user.role !== 'ADMIN')) {
            window.location.href = "/dashboard.html";
        }
        // Always send LOGISTICA as the API role — ADMIN is treated as equivalent
        const apiRole = 'LOGISTICA';

        // Mostrar zona de self-destruct apenas para o super-admin
        const SUPER_ADMIN_EMAIL = 'rodrimcoelho@gmail.com';
        if (user && user.email === SUPER_ADMIN_EMAIL) {
            document.getElementById('selfDestructZone').style.display = 'block';
        }

        async function loadUsers() {
            const r = await fetch(`/api/admin/users?role=${apiRole}`);
            const users = await r.json();
            
            document.getElementById('userTable').innerHTML = users.map(u => {
                const isLogistica = u.role === 'LOGISTICA';
                const newRole = isLogistica ? 'COORDENADOR' : 'LOGISTICA';
                const btnColor = isLogistica ? 'var(--danger)' : 'var(--success)';
                const btnLabel = isLogistica ? 'Remover Admin' : 'Tornar Logística';
                return `
                <tr>
                    <td data-label="Nome"><strong>${u.name}</strong></td>
                    <td data-label="Email">${u.email}</td>
                    <td data-label="Departamento">${u.department}</td>
                    <td data-label="Cargo"><span class="status ${isLogistica ? 'status-accepted' : 'status-pending'}">${u.role}</span></td>
                    <td data-label="Cargo">
                        <button onclick="changeRole(${u.id}, '${newRole}')" 
                                style="font-size:11px; background:${btnColor}">
                            ${btnLabel}
                        </button>
                    </td>
                    <td data-label="Eliminar">
                        <button onclick="deleteUser(${u.id})" style="background:var(--danger); font-size:11px; margin-left:5px;">Eliminar</button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function deleteUser(userId) {
            if (!await confirmDialog("Tem a certeza que deseja eliminar este utilizador?", { icon: "🗑️", danger: true, okLabel: "Eliminar" })) return;

            try {
                const res = await fetch('/api/admin/delete-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        id: userId, 
                        adminRole: apiRole
                    })
                });

                if (res.ok) {
                    toast("Utilizador eliminado com sucesso!", "success");
                    location.reload(); // Recarrega para fazer o utilizador desaparecer da lista
                } else {
                    toast("Erro ao eliminar: verifique as suas permissões.", "error");
                }
            } catch (err) {
                console.error("Erro na ligação:", err);
            }
        }

        async function changeRole(id, targetRole) {
            if(!await confirmDialog(`Mudar cargo para ${targetRole}?`, { icon: "👤" })) return;
            
            await fetch('/api/admin/update-role', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, role: targetRole, adminRole: apiRole })
            });
            loadUsers();
        }

        async function triggerSelfDestruct() {
            // Passo 1: primeiro aviso
            if (!await confirmDialog(
                "⚠️ ATENÇÃO: Esta ação é IRREVERSÍVEL.\n\nVais eliminar TODOS os dados (utilizadores, turnos, galeria, pedidos) e desativar o sistema permanentemente.",
                { icon: "💣", danger: true, okLabel: "Sim, continuar" }
            )) return;

            // Passo 2: confirmação por texto
            const code = prompt('Para confirmar, escreve exatamente:  DESTRUIR');
            if (code !== 'DESTRUIR') {
                toast("Cancelado. Código incorreto.", "warning");
                return;
            }

            const btn = document.getElementById('selfDestructBtn');
            btn.disabled = true;
            btn.textContent = '⏳ A destruir...';

            try {
                const res = await fetch('/api/admin/self-destruct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: 'AEFCUP-DESTROY-2026-RODRIGO' })
                });

                if (res.ok) {
                    localStorage.clear();
                    setTimeout(() => { window.location.href = '/shutdown.html'; }, 800);
                } else {
                    toast("Erro: não autorizado ou falha no servidor.", "error");
                    btn.disabled = false;
                    btn.textContent = '💣 Destruir Aplicação';
                }
            } catch (err) {
                toast("Erro de ligação ao servidor.", "error");
                btn.disabled = false;
                btn.textContent = '💣 Destruir Aplicação';
            }
        }

        loadUsers();
    </script>
</body>
</html>
